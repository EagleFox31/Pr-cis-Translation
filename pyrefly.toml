# Configuration Pyrefly (analyseur de types de l'IDE).
#
# POURQUOI CE FICHIER
# 1) Interpréteur. Sans config, Pyrefly devine et tombe sur un Python GLOBAL de
#    la machine (3.14…), où les dépendances ne sont pas installées → faux
#    « missing-import » (fontTools, fastapi…). Il ne lit PAS le réglage VS Code.
#    On l'ancre donc sur le venv du backend, où tout est installé.
# 2) Périmètre de vérité. Le garde-fou du projet est sa SUITE DE TESTS (313
#    contrôles hors ligne), pas un typage statique strict. Le code dialogue avec
#    des librairies C non (ou mal) typées — PyMuPDF/`fitz`, fontTools, python-pptx
#    — dont les stubs déclarent des types incomplets : Pyrefly croit alors qu'un
#    `fitz.Document` n'est pas itérable, qu'une table cmap n'a pas ses attributs,
#    etc. Ce sont des FAUX POSITIFS (le code passe tous les tests). On neutralise
#    donc ces familles de diagnostics à la frontière des librairies, tout en
#    gardant les vrais garde-fous structurels (imports, noms indéfinis, syntaxe).

# --- Interpréteur & dépendances : le venv, rien d'autre ---
python-interpreter = "backend/venv/Scripts/python.exe"
site-package-path = ["backend/venv/Lib/site-packages"]

# --- Imports de premier niveau, tels que le code les exécute réellement ---
#   `import engines`, `import app`  -> racine backend/
#   `import runtags`                -> backend/engines/ (moteurs sur le path)
#   `import racine` (aides de test) -> backend/tests/
search-path = ["backend", "backend/engines", "backend/tests"]

project-includes = ["backend", "scripts"]
# Le venv n'a pas à être analysé (dépendances tierces).
project-excludes = ["**/venv/**", "**/__pycache__/**"]

# --- Diagnostics neutralisés : bruit de typage aux frontières de librairies
#     non typées (voir §2). Le runtime est prouvé par les tests. ---
[errors]
unsupported-operation = false
missing-attribute = false
bad-argument-type = false
bad-index = false
not-iterable = false
no-matching-overload = false
bad-return = false
bad-assignment = false
bad-specialization = false
bad-function-definition = false
bad-override = false
# Warnings cosmétiques / redondance : bruit de style, pas des bugs. Le projet
# ne fait pas du linting de style via Pyrefly (il a ses tests).
unnecessary-type-conversion = false
unnecessary-comparison = false
redundant-cast = false
redundant-condition = false
unreachable = false
deprecated = false
