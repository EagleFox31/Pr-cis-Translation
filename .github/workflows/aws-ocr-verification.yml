name: Verify Précis scanned PDF translation
on:
  workflow_run:
    workflows: ["Deploy Précis permanent host through AppFactory AWS/SSM"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.repository == 'EagleFox31/Pr-cis-Translation' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458018461157:role/precis-translation-staging-github-deployer
          aws-region: eu-west-3
      - name: Recognize and translate one synthetic scanned PDF
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json,re,time
          target=subprocess.check_output(['aws','cloudformation','describe-stacks','--stack-name','precis-translation-staging-app','--query',"Stacks[0].Outputs[?OutputKey=='StagingInstanceId'].OutputValue | [0]",'--output','text'],text=True).strip()
          assert re.fullmatch(r'i-[a-f0-9]+',target)
          host_command = """
          docker exec -w /app/backend precis-translation-staging-backend-1 python scripts/verify_ocr_runtime.py
          """
          command=subprocess.check_output(['aws','ssm','send-command','--instance-ids',target,'--document-name','AWS-RunShellScript','--parameters',json.dumps({'commands':[host_command]}),'--query','Command.CommandId','--output','text'],text=True).strip()
          for _ in range(36):
              p=subprocess.run(['aws','ssm','get-command-invocation','--command-id',command,'--instance-id',target,'--output','json'],capture_output=True,text=True)
              if p.returncode==0:
                  result=json.loads(p.stdout)
                  if result['Status'] in ('Success','Failed','TimedOut','Cancelled'):
                      print(result.get('StandardOutputContent',''))
                      print(result.get('StandardErrorContent',''))
                      if result['Status']!='Success': raise SystemExit('Translation provider verification failed')
                      break
              time.sleep(5)
          else: raise SystemExit('Translation provider verification timed out')
          PY
