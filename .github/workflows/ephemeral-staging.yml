name: Ephemeral Docker Compose staging (no cloud resources)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ephemeral-staging.yml'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precis-ephemeral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      COMPOSE_PROJECT_NAME: precis-ci-${{ github.run_id }}
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated credentials and loopback-only Compose port
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          template=Path('backend/.env.example').read_text()
          values={
            'PRECIS_ENV':'development',
            'FRONTEND_API_KEY':'precis_ci_'+secrets.token_urlsafe(32),
            'POSTGRES_USER':'precis',
            'POSTGRES_PASSWORD':secrets.token_hex(24),
            'POSTGRES_DB':'precis',
            'JWT_SECRET':secrets.token_urlsafe(48),
            'EMAIL_ENABLED':'false',
            'CAMPAY_ENV':'DEMO',
            'ALLOWED_ORIGINS':'http://127.0.0.1:18080',
            'FRONTEND_URL':'http://127.0.0.1:18080'
          }
          rows=[]
          for line in template.splitlines():
              key=line.partition('=')[0]
              rows.append(key+'='+values[key] if key in values and '=' in line and not line.lstrip().startswith('#') else line)
          file=Path('backend/.env')
          file.write_text('\n'.join(rows)+'\n')
          file.chmod(0o600)
          compose=Path('docker-compose.yml')
          original=compose.read_text()
          old='- "80:80"'
          if original.count(old)!=1:
              raise SystemExit('Expected exactly one published web port; refuse unsafe rewrite')
          compose.write_text(original.replace(old,'- "127.0.0.1:18080:80"'))
          PY
      - name: Validate isolated Compose configuration
        run: docker compose --env-file backend/.env config --quiet
      - name: Build and boot isolated app with fresh database
        run: docker compose --env-file backend/.env up -d --build --wait --wait-timeout 180
      - name: Verify web and reverse-proxied backend health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/ -o /dev/null &&
               docker compose --env-file backend/.env exec -T backend curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health -o /dev/null; then
              echo "Isolated frontend and backend healthy" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Ephemeral stack failed health checks"
          exit 1
      - name: Verify seeded persistence survives backend restart
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file backend/.env exec -T backend sh -c 'printf persisted > /app/backend/translations/appfactory-ci-probe'
          docker compose --env-file backend/.env restart backend
          for i in $(seq 1 25); do
            if docker compose --env-file backend/.env exec -T backend curl -fsS http://127.0.0.1:8000/health -o /dev/null; then break; fi
            sleep 4
          done
          docker compose --env-file backend/.env exec -T backend sh -c 'test "$(cat /app/backend/translations/appfactory-ci-probe)" = persisted'
          echo "Translation volume persistence survived backend restart" >> "$GITHUB_STEP_SUMMARY"
      - name: Rehearse PostgreSQL and document restores plus failed-image rollback
        shell: bash
        run: bash scripts/ci/verify-ephemeral-recovery.sh
      - name: Collect non-secret container status on failure
        if: failure()
        run: docker compose --env-file backend/.env ps --all || true
      - name: Destroy ephemeral stack and named volumes
        if: always()
        shell: bash
        run: |
          docker compose --env-file backend/.env down --volumes --remove-orphans || true
          rm -f backend/.env
          rm -f "$RUNNER_TEMP/precis-ci-postgres.dump" "$RUNNER_TEMP/precis-ci-postgres.dump.sha256" "$RUNNER_TEMP/precis-ci-translation.backup" "$RUNNER_TEMP/precis-ci-translation.backup.sha256" "$RUNNER_TEMP/precis-ci-rollback.yml"
