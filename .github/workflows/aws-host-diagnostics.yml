name: Précis host diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/aws-host-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458018461157:role/precis-translation-staging-github-deployer
          aws-region: eu-west-3
      - name: Read sanitized previous SSM execution output from dedicated host
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,time
          host_code = """
          from pathlib import Path
          import subprocess
          secret_values=[]
          env=Path('/opt/appfactory/precis-translation/repo/backend/.env')
          if env.exists():
              for row in env.read_text().splitlines():
                  if '=' in row and not row.lstrip().startswith('#'):
                      value=row.split('=',1)[1].strip().strip("'").strip('"')
                      if len(value)>=6: secret_values.append(value)
          def sanitize(text):
              for value in sorted(secret_values,key=len,reverse=True): text=text.replace(value,'[MASKED]')
              return text
          root=Path('/var/lib/amazon/ssm/i-0ce97ff971dd343b2/document/orchestration')
          for name in ('stdout','stderr'):
              files=sorted(root.glob('*/awsrunShellScript/*/'+name),key=lambda p:p.stat().st_mtime,reverse=True)
              for p in files:
                  if p.stat().st_size:
                      print('Previous SSM '+name+':')
                      print(sanitize(p.read_text(errors='replace')[-12000:]))
                      break
          for cmd in (['cloud-init','status'],['docker','ps','-a']):
              p=subprocess.run(cmd,capture_output=True,text=True)
              print(sanitize(p.stdout+p.stderr))
          """
          commands="python3 - <<'HOST'\n"+host_code+"\nHOST\n"
          r=subprocess.check_output(['aws','ssm','send-command','--instance-ids','i-0ce97ff971dd343b2','--document-name','AWS-RunShellScript','--parameters',json.dumps({'commands':[commands]}),'--query','Command.CommandId','--output','text'],text=True).strip()
          for _ in range(24):
              p=subprocess.run(['aws','ssm','get-command-invocation','--command-id',r,'--instance-id','i-0ce97ff971dd343b2','--output','json'],capture_output=True,text=True)
              if p.returncode==0:
                  d=json.loads(p.stdout)
                  if d['Status'] in ('Success','Failed','TimedOut','Cancelled'):
                      print(d.get('StandardOutputContent',''))
                      print(d.get('StandardErrorContent',''))
                      if d['Status']!='Success': raise SystemExit('Host diagnostics failed')
                      break
              time.sleep(5)
          else: raise SystemExit('Host diagnostics timed out')
          PY
