name: AppFactory container plan (no deployment)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-container-build.yml@8c3517020badf20d4c915c9c2d365cae1b4f45f7
    with:
      config_path: .github/appfactory-deploy.json
      mode: plan
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      appfactory_ref: 8c3517020badf20d4c915c9c2d365cae1b4f45f7
