name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@8c3517020badf20d4c915c9c2d365cae1b4f45f7
    with:
      appfactory_ref: 8c3517020badf20d4c915c9c2d365cae1b4f45f7
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  iac:
    name: Validate bounded production IAM CloudFormation template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Reject invalid or broad AWS IAM template
        run: python scripts/ci/verify_cloudformation_iam.py

  production-deploy:
    name: Validate AppFactory AWS/SSM production adapter (without AWS writes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check staged host deploy script
        run: bash -n scripts/staging/aws-ssm-compose.sh
      - name: Validate ZIP-to-SSM staging importer syntax
        run: |
          python3 -m py_compile scripts/staging/import-env-to-ssm.py
          python3 -m unittest discover -s scripts/ci -p test_env_import.py
      - name: Verify production metadata and reviewed OIDC migration
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/ci/verify_production_automation.py
          python3 -m unittest discover -s scripts/ci -p test_production_oidc.py
      - name: Refuse Atelier production parameters and unpinned workflow
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'atelier-maitre|atelier2026|AWS_SECRET_ACCESS_KEY' scripts/staging/aws-ssm-compose.sh .github/workflows/aws-production-deploy.yml
          grep -q 'arn:aws:iam::458018461157:role/precis-translation-staging-github-deployer' .github/workflows/aws-production-deploy.yml
          grep -q '/precis-translation/staging/env' .github/workflows/aws-production-deploy.yml

  python:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'python') }}
    name: Suites backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      # 8 des 21 suites appellent `create_async_engine` AU NIVEAU MODULE, donc
      # à l'import, hors de tout `try` : test_admin_users,
      # test_download_format_integrity, test_error_logs, test_paiement_page,
      # test_pptx_preview, test_revue_ultra, test_support, test_verrous_plan.
      # Aucune ne se replie sur SQLite ni ne se saute gracieusement. Sans base,
      # la garde est rouge d'emblée — et l'on serait tenté d'exclure
      # précisément `test_verrous_plan` et `test_garde_secrets`, les deux plus
      # utiles avant une mise en ligne.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: precis
          POSTGRES_PASSWORD: precis_ci
          POSTGRES_DB: precis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U precis -d precis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://precis:precis_ci@localhost:5432/precis
      # Sans lui, la sortie accentuée des assertions se décode de travers et
      # des comparaisons justes échouent à tort.
      PYTHONIOENCODING: utf-8
      PRECIS_NO_BANNER: '1'
      EMAIL_ENABLED: 'false'
      # ATTENTION, ON NE POSE NI `ALLOWED_ORIGINS` NI `FRONTEND_URL` :
      # `config.py` arme `IS_PRODUCTION` dès qu'une origine NON LOCALE est
      # déclarée. Y mettre un vrai domaine armerait le garde de production
      # dans l'intégration continue, et l'application refuserait de monter —
      # avec raison, mais pour rien. `test_garde_secrets` manipule cela
      # lui-même, par sous-processus, donc il n'est pas gêné.

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          # La version du `backend/Dockerfile`. Pas plus récente : on garde
          # ce qui tournera réellement en production, et PyMuPDF comme asyncpg
          # n'ont pas forcément de roues ailleurs.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Secrets d'integration, aleatoires
        run: |
          # Un secret de test ne peut pas être un gabarit : `config.py` refuse
          # tout ce qui contient `example`, `dummy`, `placeholder`,
          # `dev-secret`, `insecure`, `sample`… (`_MARQUEURS_GABARIT`). Un
          # `JWT_SECRET=ci-example-...` ferait échouer la garde elle-même.
          # De l'hexadécimal pur ne contient aucun de ces marqueurs, et
          # change à chaque exécution — donc rien à fuir.
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "FRONTEND_API_KEY=$(openssl rand -hex 24)"
            echo "DEEPSEEK_API_KEY=$(openssl rand -hex 24)"
            echo "POSTGRES_USER=precis"
            echo "POSTGRES_PASSWORD=precis_ci"
            echo "POSTGRES_DB=precis"
          } >> "$GITHUB_ENV"

      - name: Dependances Python
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: LibreOffice et polices
        # `test_apercu_progressif` et `test_ole_apercu` convertissent réellement
        # des documents. Une garde qui les sauterait ne garderait pas l'aperçu,
        # c'est-à-dire la moitié visible du produit. Les polices ne sont pas
        # décoratives : sans elles, la conversion substitue et la mesure de
        # densité d'encre des moteurs devient fausse.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-impress libreoffice-calc \
            fonts-liberation fonts-dejavu-core \
            tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng tesseract-ocr-osd
          soffice --version

      - name: Rehearse upgrade from the deployed schema with existing data
        env:
          DATABASE_URL: postgresql+asyncpg://precis:precis_ci@localhost:5432/precis_migration_ci
          PGPASSWORD: precis_ci
        run: |
          psql -h 127.0.0.1 -U precis -d postgres -c 'CREATE DATABASE precis_migration_ci'
          python scripts/ci/verify_migration_upgrade.py

      - name: Migrations
        working-directory: backend
        # Les suites ne créent pas le schéma — aucune n'appelle `create_all` ni
        # alembic. `migrations/env.py` lit `DATABASE_URL` dans l'environnement.
        run: alembic upgrade head

      - name: Les 21 suites
        working-directory: backend
        run: |
          set -uo pipefail

          # Le glob, et non une liste écrite dans ce fichier : une 22e suite
          # ajoutée demain serait exécutée sans que personne n'y pense, alors
          # qu'une liste codée en dur se périmerait en silence et ne garderait
          # rien.
          suites=(tests/test_*.py)
          nombre=${#suites[@]}
          echo "Suites decouvertes : $nombre"

          # LE GARDE CONTRE LA PANNE LA PLUS TROMPEUSE : un glob qui ne
          # correspond à rien (mauvais répertoire de travail, renommage du
          # dossier) laisserait la boucle « réussir » en n'exécutant AUCUN
          # test. La garde serait verte et ne garderait plus rien.
          if [ "$nombre" -lt 21 ]; then
            echo "::error::$nombre suites trouvees, 21 attendues au minimum."
            echo "Soit le repertoire de travail est faux, soit des suites ont disparu."
            exit 1
          fi

          echecs=()
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            if python "$suite"; then
              echo "OK $suite"
            else
              echo "::error file=backend/$suite::Suite en echec : $suite"
              echecs+=("$suite")
            fi
            echo "::endgroup::"
          done

          echo "─────────────────────────────────────────────"
          echo "$nombre suites executees, ${#echecs[@]} en echec"
          if [ ${#echecs[@]} -gt 0 ]; then
            printf 'ECHEC : %s\n' "${echecs[@]}"
            exit 1
          fi

      - name: Journal des migrations si echec
        if: failure()
        working-directory: backend
        run: alembic current || true

  frontend:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'frontend') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: TypeScript and bilingual i18n check
        run: npm run lint --prefix frontend
      - name: Vite production bundle compilation
        run: npm run build --prefix frontend

  seo:
    name: Verify search discovery through nginx
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Serve static frontend through production nginx configuration
        run: |
          mkdir -p /tmp/precis-seo
          cp -R frontend/public/. /tmp/precis-seo/
          cp frontend/index.html /tmp/precis-seo/index.html
          docker run -d --name precis-seo --add-host backend:127.0.0.1 -p 8081:80 -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" -v /tmp/precis-seo:/usr/share/nginx/html:ro nginx:1.27-alpine
          docker exec precis-seo nginx -t
      - name: Verify crawlable landing, exclusions, redirects and discovery files
        run: python3 scripts/ci/verify_public_seo.py http://127.0.0.1:8081
      - name: Print nginx logs if verification fails
        if: failure()
        run: docker logs precis-seo

  result:
    if: always()
    needs: [impact, python, frontend, iac, production-deploy, seo]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce real CI results
        env:
          SEO: ${{ needs.seo.result }}
          IMPACT: ${{ needs.impact.result }}
          PYTHON: ${{ needs.python.result }}
          FRONTEND: ${{ needs.frontend.result }}
          IAC: ${{ needs.iac.result }}
          STAGING: ${{ needs.production-deploy.result }}
        run: |
          if [[ "$SEO" != success ]]; then
            echo "::error::Search discovery contract failed: $SEO"
            exit 1
          fi
          if [[ "$STAGING" != success ]]; then
            echo "::error::Staging deployment contract gate failed: $STAGING"
            exit 1
          fi
          if [[ "$IAC" != success ]]; then
            echo "::error::IAM IaC gate failed: $IAC"
            exit 1
          fi
          if [[ "$IMPACT" != success ]]; then
            echo "::error::Impact analysis failed: $IMPACT"
            exit 1
          fi
          for result in "$PYTHON" "$FRONTEND"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::An impacted gate failed: $result"
              exit 1
            fi
          done
          echo "Impact analysis passed; impacted gates have completed successfully." >> "$GITHUB_STEP_SUMMARY"

