name: Verify public Précis HTTPS
on:
  workflow_run:
    workflows: ["Deploy Précis permanent host through AppFactory AWS/SSM"]
    types: [completed]
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify DNS, trusted TLS, frontend assets, backend and CORS
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,socket,json,re,time,struct
          from html.parser import HTMLParser
          origin='https://precis-translator.trigenys.com'
          hostname=urllib.parse.urlparse(origin).hostname
          def request(path,method='GET',headers=None):
              req=urllib.request.Request(origin+path,method=method,headers={'User-Agent':'WhatsApp/2.24.1',**(headers or {})})
              return urllib.request.urlopen(req,timeout=15)
          for attempt in range(18):
              try:
                  addresses={r[4][0] for r in socket.getaddrinfo(hostname,443,type=socket.SOCK_STREAM)}
                  assert '13.36.127.47' in addresses, 'DNS does not yet point to the confirmed Elastic IP'
                  with request('/') as r:
                      assert r.status==200
                      html=r.read(1024*1024).decode('utf-8')
                      assert '<html' in html.lower()
                  class Metadata(HTMLParser):
                      def __init__(self):
                          super().__init__();self.tags={}
                      def handle_starttag(self,tag,attrs):
                          if tag=='meta':
                              values=dict(attrs)
                              self.tags[values.get('property') or values.get('name')]=values.get('content')
                  metadata=Metadata();metadata.feed(html)
                  image=metadata.tags.get('og:image','')
                  assert image.startswith(origin+'/social/'), 'Public Open Graph image missing from initial HTML'
                  assert metadata.tags.get('twitter:card')=='summary_large_image'
                  with request(image[len(origin):]) as r:
                      assert r.status==200 and r.headers.get_content_type()=='image/png'
                      png=r.read(2*1024*1024)
                      assert png.startswith(b'\x89PNG\r\n\x1a\n')
                      assert struct.unpack('>II',png[16:24])==(1200,630), 'Unexpected social card dimensions'
                  assets=[p for p in re.findall(r'<script[^>]+src="([^"]+)"',html) if p.startswith('/assets/')]
                  assert assets, 'Frontend JS bundle reference absent'
                  with request(assets[0]) as r:
                      assert r.status==200 and r.read(256), 'Frontend bundle missing'
                  with request('/health') as r:
                      assert r.status==200
                      health=json.load(r)
                      assert isinstance(health,dict) and health
                  with request('/health','OPTIONS',{'Origin':origin,'Access-Control-Request-Method':'GET'}) as r:
                      assert r.headers.get('Access-Control-Allow-Origin')==origin, 'CORS origin not aligned'
                  with urllib.request.urlopen('http://'+hostname+'/',timeout=15) as r:
                      assert r.geturl().startswith(origin), 'HTTP does not redirect to HTTPS'
                  print('PASS: DNS, trusted HTTPS, frontend asset, backend health, matching CORS, HTTP redirect and crawler-readable social image.')
                  break
              except Exception as error:
                  print('Public verification pending: '+type(error).__name__+': '+str(error))
                  if attempt==17: raise SystemExit('Public verification failed')
                  time.sleep(8)
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live search discovery contract
        run: python3 scripts/ci/verify_public_seo.py https://precis-translator.trigenys.com
      - name: Notify IndexNow of the public landing page
        run: |
          python3 - <<'PY'
          import json, urllib.request
          origin = 'https://precis-translator.trigenys.com'
          key = 'baa72b69afa54b709024e6d1d62ae456'
          with urllib.request.urlopen(origin + '/' + key + '.txt', timeout=20) as response:
              assert response.read().decode().strip() == key
          data = json.dumps({'host': 'precis-translator.trigenys.com', 'key': key,
              'keyLocation': origin + '/' + key + '.txt', 'urlList': [origin + '/home']}).encode()
          request = urllib.request.Request('https://api.indexnow.org/indexnow', data=data,
              headers={'Content-Type': 'application/json; charset=utf-8'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status in (200, 202)
              message = 'IndexNow submission accepted: HTTP ' + str(response.status)
              if response.status == 202:
                  message += ' (key validation pending)'
              print(message + '; this does not confirm indexing.')
          PY
