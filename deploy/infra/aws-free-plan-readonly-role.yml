AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AppFactory-managed Précis staging AWS Free Plan reader role.
  No EC2, SSM execution, paid resources or production permissions.
Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing GitHub Actions OIDC provider in this AWS account
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:oidc-provider/token[.]actions[.]githubusercontent[.]com$'
  PermissionsBoundaryArn:
    Type: String
    Description: Mandatory AppFactory-managed read-only permissions boundary
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:policy/appfactory-staging-free-plan-boundary$'
Resources:
  PrecisStagingFreePlanReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: precis-translation-staging-free-plan-read
      Description: Read-only AWS Free Plan query for the Précis staging pipeline
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      Tags:
        - Key: AppFactoryProject
          Value: precis-translation
        - Key: AppFactoryEnvironment
          Value: staging
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:EagleFox31@86088743/Pr-cis-Translation@1411758415:environment:staging'
      Policies:
        - PolicyName: readonly-free-tier-account-plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: freetier:GetAccountPlanState
                Resource: '*'
Outputs:
  ReadOnlyRoleArn:
    Description: Fixed, dedicated AWS Free Plan staging reader ARN
    Value: !GetAtt PrecisStagingFreePlanReadRole.Arn
