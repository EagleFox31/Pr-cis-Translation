AWSTemplateFormatVersion: '2010-09-09'
Description: Précis public HTTPS network on its existing dedicated host. No SSH or database ingress.
Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
Resources:
  PublicAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: AppFactoryProject
          Value: precis-translation
        - Key: Purpose
          Value: permanent-public-address
  PublicAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt PublicAddress.AllocationId
      InstanceId: !Ref InstanceId
  HttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: HTTPS redirect and ACME domain validation
  HttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Public application HTTPS
  SmtpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SecurityGroupId
      IpProtocol: tcp
      FromPort: 587
      ToPort: 587
      CidrIp: 0.0.0.0/0
      Description: Authenticated SMTP with STARTTLS
Outputs:
  PublicIp:
    Value: !Ref PublicAddress
  InstanceId:
    Value: !Ref InstanceId
  PublicUrl:
    Value: https://precis.trigenys.com
