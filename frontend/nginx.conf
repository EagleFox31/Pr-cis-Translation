# ══════════════════════════════════════════════════════════════════════════════
#  nginx — sert l'interface et relaie l'API
#
#  L'interface et le service partagent UNE SEULE adresse publique. C'est ce qui
#  permet à `VITE_API_BASE` de rester vide : le navigateur appelle `/api/...`
#  sur la page elle-même, aucune requête ne part vers un autre domaine, et CORS
#  n'entre jamais en jeu.
#
#  Le HTTPS n'est pas ici : il est ajouté à l'étape 4 (nom de domaine +
#  certificat). Ce fichier ne parle que du HTTP interne.
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 100 Mo — la MÊME limite que MAX_FILE_SIZE côté service. Si nginx était
    # plus strict, il couperait l'envoi avec un 413 brut, sans passer par le
    # message d'erreur soigné de l'application ; s'il était plus permissif, on
    # transférerait un fichier de 200 Mo pour le refuser à l'arrivée.
    client_max_body_size 100M;

    # Les envois de gros documents sur une connexion mobile camerounaise sont
    # lents. Les délais par défaut (60 s) coupent la requête en plein transfert.
    client_body_timeout 300s;

    # En HTTPS, Caddy (service `edge`) relaie depuis le réseau Docker et
    # remplace X-Forwarded-For par l'adresse réelle du client. On ne croit cet
    # en-tête que de l'adresse FIXE de Caddy (docker-compose.https.yml) : la
    # passerelle Docker, par où passe un client qui frappe nginx directement
    # (proxy userland, IPv6), est aussi une adresse privée et ne doit pas
    # pouvoir réécrire l'adresse vue par l'anti-abus.
    set_real_ip_from 172.30.250.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    # ── L'API ────────────────────────────────────────────────────────────────
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Sans ces en-têtes, l'application voit toutes les requêtes venir de
        # nginx : le journal, la limitation de débit et les alertes désignent
        # alors une seule et même adresse pour tout le monde.
        #
        # X-Forwarded-For est ÉCRASÉ, jamais complété : `$proxy_add_x_forwarded_for`
        # recopierait la valeur envoyée par le client, et une adresse inventée
        # suffirait à contourner toutes les limites par IP. `$remote_addr` est
        # l'adresse vue par nginx, corrigée seulement si la requête arrive par
        # le relais HTTPS du réseau Docker (voir `set_real_ip_from` plus haut).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── LE point critique de ce fichier ──────────────────────────────────
        # `proxy_buffering off` : la traduction progressive envoie ses pages au
        # fil de l'eau (flux SSE). Avec la mise en tampon par défaut, nginx
        # retient tout jusqu'à la fin de la traduction et livre les événements
        # d'un bloc : l'aperçu page par page — la fonction la plus visible du
        # produit — disparaîtrait purement et simplement, sans erreur, et
        # marcherait pourtant parfaitement en développement.
        proxy_buffering off;
        proxy_cache off;

        # Une traduction longue peut dépasser l'heure. Le défaut (60 s) fermerait
        # le flux en plein travail, et le client verrait une traduction
        # « interrompue » alors qu'elle se poursuit côté serveur.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sonde de santé du service, utile depuis l'extérieur pour distinguer
    # « l'interface est servie » de « le service répond ».
    location = /health {
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # ── L'interface ──────────────────────────────────────────────────────────
    # Les fichiers produits par Vite portent une empreinte dans leur nom
    # (`index-a3f9c1.js`) : leur contenu ne change jamais pour un nom donné, on
    # peut donc les garder un an en cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # One public landing URL; preserve campaign/share parameters.
    absolute_redirect off;
    location = / { return 308 /home$is_args$args; }
    location = /home/ { return 308 /home$is_args$args; }
    location = /index.html { return 308 /home$is_args$args; }

    location = /home {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Crawlers may fetch these pages to see noindex. Authentication still
    # belongs to the backend; this header only controls search visibility.
    location ~ ^/(login|register|verify-email|beta|admin(/.*)?)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Discovery files must never fall back to SPA HTML.
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
