# Inclus au niveau server ET dans chaque location qui pose son propre
# add_header : nginx n'hérite plus des en-têtes du niveau supérieur dès
# qu'une location en déclare un.
# Aucune page ne peut être affichée dans un cadre d'un autre site (clickjacking
# sur « Activer » ou /admin). Le paiement Paddle n'est pas concerné : c'est
# nous qui affichons son cadre, pas l'inverse.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
