<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Précis</title>
  <style>
    /* Jetons recopiés de la charte du site (frontend/src/index.css, :root) ; voir aussi contenu/theme.ts. */
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("polices/dm-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 500; src: url("polices/dm-sans-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 600; src: url("polices/dm-sans-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Pinyon Script"; font-weight: 400; src: url("polices/pinyon-script-latin-400-normal.woff2") format("woff2"); }
    :root {
      --navy: #0d1b3e; --blue: #1a4dc7; --blue-bright: #2563eb; --blue-light: #dbeafe; --white: #ffffff;
      --gray-50: #f8fafc; --gray-200: #e2e8f0; --gray-300: #cbd5e1; --gray-400: #94a3b8;
      --gray-500: #64748b; --gray-700: #334155; --gray-900: #0f172a;
    }
    body { width: 320px; margin: 0; padding: 16px 18px 18px; background: var(--white); color: var(--gray-900);
      font: 14px/1.45 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .marque { display: flex; align-items: center; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--gray-200); }
    .marque img { height: 32px; width: auto; }
    .marque span { margin-left: -2px; font: 400 32px/1 "Pinyon Script", cursive; color: var(--navy); }
    form, #vue-connecte { display: flex; flex-direction: column; }
    label { margin: 12px 0 5px; font-size: 13px; font-weight: 500; color: var(--gray-700); }
    label:first-child { margin-top: 0; }
    input[type="email"], input[type="password"], select { width: 100%; box-sizing: border-box; padding: 9px 12px;
      font: inherit; color: var(--gray-900); background: var(--gray-50); border: 1.5px solid var(--gray-200);
      border-radius: 10px; outline: none; transition: border-color .15s ease, background .15s ease, box-shadow .15s ease; }
    input:focus, select:focus { border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 3px rgba(26,77,199,.12); }
    button { width: 100%; margin-top: 10px; padding: 11px 16px; font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
      border-radius: 9px; cursor: pointer; border: 1px solid transparent; background: var(--blue); color: var(--white);
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease; }
    button:first-of-type { margin-top: 14px; }
    button:hover:not(:disabled) { background: var(--blue-bright); box-shadow: 0 4px 14px rgba(26,77,199,.28); }
    button.secondaire { margin-top: 8px; background: var(--white); color: var(--blue); border-color: var(--blue); }
    button.secondaire:hover:not(:disabled) { background: var(--blue-light); box-shadow: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.charge { display: inline-flex; align-items: center; justify-content: center; gap: 8px; opacity: .8; cursor: progress; }
    button.charge::before { content: ""; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid currentColor; border-right-color: transparent; animation: tourne .7s linear infinite; }
    @keyframes tourne { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { button.charge::before { animation-duration: 2s; } }
    .marque .version { margin-left: auto; margin-right: 0; font-family: inherit; font-size: 12px; line-height: 1; color: var(--gray-500); }
    .compte { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding: 10px 12px;
      background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 10px; }
    .initiale { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
      background: var(--blue-light); color: var(--blue); font-size: 13px; font-weight: 600; text-transform: uppercase; }
    .identite { flex: 1; min-width: 0; font-size: 13px; }
    .identite span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .identite small { display: block; font-size: 11px; color: var(--gray-500); }
    button.icone { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin: 0; padding: 0;
      background: var(--white); color: var(--gray-500); border-color: var(--gray-200); border-radius: 8px; }
    button.icone:hover:not(:disabled) { background: var(--gray-50); color: var(--gray-900); box-shadow: none; }
    button.icone svg { width: 16px; height: 16px; }
    .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .duo button { margin: 0; }
    .pied { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px;
      border-top: 1px solid var(--gray-200); font-size: 12px; color: var(--gray-500); }
    .case { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 12px; font-weight: 400; color: var(--gray-700); cursor: pointer; }
    .case input { margin: 0; accent-color: var(--blue); }
    .pied .case { flex-basis: 100%; margin-top: 0; color: var(--gray-500); }
    .pied a { color: var(--blue); }
    .pied a:hover { color: var(--navy); }
    .message { margin: 12px 0 0; font-size: 13px; color: var(--gray-700); }
    .message:empty { display: none; }
    .message.erreur { padding: 10px 12px; border: 1px solid #fecaca; border-radius: 10px; background: #fef2f2; color: #991b1b; }
    .maj { margin: 0 0 14px; padding: 12px; border: 1px solid var(--blue-light); border-radius: 10px; background: #eff6ff; font-size: 13px; color: var(--gray-700); }
    .maj strong { display: block; color: var(--navy); }
    .maj ol { margin: 6px 0 0; padding-left: 18px; }
    .maj-actions { display: flex; gap: 8px; margin-top: 10px; }
    .maj-actions button { margin-top: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="marque">
    <img src="logo.png" alt="P"><span>récis</span><span class="version" id="version"></span>
  </header>

  <section id="maj" class="maj" hidden aria-live="polite">
    <strong>Nouvelle version <span id="maj-version"></span> disponible</strong>
    <ol>
      <li>Téléchargez-la.</li>
      <li>Décompressez-la à la place du dossier actuel de l'extension.</li>
      <li>Cliquez sur « Recharger ».</li>
    </ol>
    <div class="maj-actions">
      <button id="btn-maj-telecharger" type="button">Télécharger</button>
      <button id="btn-maj-recharger" type="button" class="secondaire">Recharger</button>
    </div>
  </section>

  <form id="vue-connexion" hidden>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" required autocomplete="current-password">
    <button id="btn-connexion" type="submit">Se connecter</button>
  </form>

  <div id="vue-connecte" hidden>
    <div class="compte">
      <span class="initiale" id="initiale" aria-hidden="true"></span>
      <span class="identite"><span id="compte"></span><small id="forfait" hidden></small></span>
      <button id="btn-deconnexion" type="button" class="icone" title="Déconnexion" aria-label="Déconnexion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
    <label for="langue">Langue cible</label>
    <select id="langue">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="ar">العربية</option>
    </select>
    <div class="duo">
      <button id="btn-traduire" type="button">Traduire</button>
      <button id="btn-original" type="button" class="secondaire">Original</button>
    </div>
    <label class="case"><input type="checkbox" id="toujours"> Toujours appliquer pour ce site</label>
    <p class="pied">
      <span id="memoire"></span>
      <a id="btn-memoire" href="#" hidden>Effacer</a>
      <label class="case"><input type="checkbox" id="proposer"> Proposer la traduction automatiquement</label>
    </p>
  </div>

  <p id="message" class="message" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
