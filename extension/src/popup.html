<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Précis</title>
  <style>
    /* Jetons recopiés de la charte du site (frontend/src/index.css, :root) ; voir aussi contenu/theme.ts. */
    @font-face { font-family: "DM Sans"; font-weight: 400; src: url("polices/dm-sans-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 500; src: url("polices/dm-sans-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 600; src: url("polices/dm-sans-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Pinyon Script"; font-weight: 400; src: url("polices/pinyon-script-latin-400-normal.woff2") format("woff2"); }
    :root {
      --navy: #0d1b3e; --blue: #1a4dc7; --blue-bright: #2563eb; --blue-light: #dbeafe; --white: #ffffff;
      --gray-50: #f8fafc; --gray-200: #e2e8f0; --gray-300: #cbd5e1; --gray-400: #94a3b8;
      --gray-500: #64748b; --gray-700: #334155; --gray-900: #0f172a;
    }
    body { width: 320px; margin: 0; padding: 16px 18px 18px; background: var(--white); color: var(--gray-900);
      font: 14px/1.45 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .marque { display: flex; align-items: center; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--gray-200); }
    .marque img { height: 32px; width: auto; }
    .marque span { margin-left: -2px; font: 400 32px/1 "Pinyon Script", cursive; color: var(--navy); }
    form, #vue-connecte { display: flex; flex-direction: column; }
    label { margin: 12px 0 5px; font-size: 13px; font-weight: 500; color: var(--gray-700); }
    label:first-child { margin-top: 0; }
    input[type="email"], input[type="password"], select { width: 100%; box-sizing: border-box; padding: 9px 12px;
      font: inherit; color: var(--gray-900); background: var(--gray-50); border: 1.5px solid var(--gray-200);
      border-radius: 10px; outline: none; transition: border-color .15s ease, background .15s ease, box-shadow .15s ease; }
    input:focus, select:focus { border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 3px rgba(26,77,199,.12); }
    button { width: 100%; margin-top: 10px; padding: 11px 16px; font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
      border-radius: 9px; cursor: pointer; border: 1px solid transparent; background: var(--blue); color: var(--white);
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease; }
    button:first-of-type { margin-top: 14px; }
    button:hover:not(:disabled) { background: var(--blue-bright); box-shadow: 0 4px 14px rgba(26,77,199,.28); }
    button.secondaire { margin-top: 8px; background: var(--white); color: var(--blue); border-color: var(--blue); }
    button.secondaire:hover:not(:disabled) { background: var(--blue-light); box-shadow: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .compte { margin: 0 0 12px; font-size: 13px; color: var(--gray-500); word-break: break-all; }
    .message { margin: 12px 0 0; font-size: 13px; color: var(--gray-700); }
    .message:empty { display: none; }
    .message.erreur { padding: 10px 12px; border: 1px solid #fecaca; border-radius: 10px; background: #fef2f2; color: #991b1b; }
    .note { margin: 12px 0 0; font-size: 12px; color: var(--gray-500); }
    a.lien { align-self: flex-start; margin-top: 12px; font-size: 13px; color: var(--gray-500); }
    a.lien:hover, .memoire a:hover { color: var(--gray-700); }
    .memoire { display: flex; justify-content: space-between; gap: 8px; }
    .memoire a { color: var(--gray-500); }
    .maj { margin: 0 0 14px; padding: 12px; border: 1px solid var(--blue-light); border-radius: 10px; background: #eff6ff; font-size: 13px; color: var(--gray-700); }
    .maj strong { display: block; color: var(--navy); }
    .maj ol { margin: 6px 0 0; padding-left: 18px; }
    .maj-actions { display: flex; gap: 8px; margin-top: 10px; }
    .maj-actions button { margin-top: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="marque">
    <img src="logo.png" alt="P"><span>récis</span>
  </header>

  <section id="maj" class="maj" hidden aria-live="polite">
    <strong>Nouvelle version <span id="maj-version"></span> disponible</strong>
    <ol>
      <li>Téléchargez-la.</li>
      <li>Décompressez-la à la place du dossier actuel de l'extension.</li>
      <li>Cliquez sur « Recharger ».</li>
    </ol>
    <div class="maj-actions">
      <button id="btn-maj-telecharger" type="button">Télécharger</button>
      <button id="btn-maj-recharger" type="button" class="secondaire">Recharger</button>
    </div>
  </section>

  <form id="vue-connexion" hidden>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" required autocomplete="current-password">
    <button id="btn-connexion" type="submit">Se connecter</button>
  </form>

  <div id="vue-connecte" hidden>
    <p class="compte" id="compte"></p>
    <label for="langue">Langue cible</label>
    <select id="langue">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="ar">العربية</option>
    </select>
    <button id="btn-traduire" type="button">Traduire cette page</button>
    <button id="btn-original" type="button" class="secondaire">Afficher l'original</button>
    <p class="note memoire">
      <span id="memoire"></span>
      <a id="btn-memoire" href="#" hidden>Effacer</a>
    </p>
    <a id="btn-deconnexion" class="lien" href="#">Déconnexion</a>
    <p class="note">Les cadres d'une autre origine non accordée ne sont pas traités.</p>
  </div>

  <p id="message" class="message" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
